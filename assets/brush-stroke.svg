<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 20" preserveAspectRatio="none">
  <!-- Hand-painted brush stroke accent. Filled shape (not a single stroke)
       so width varies organically along the path — fuller in the middle,
       tapered at the ends. Small drips trail off the right side. Uses
       currentColor so the stroke inherits whatever color is set on the
       parent element (typically pennant-yellow for Dutchman's). -->
  <path fill="currentColor" opacity="0.85" d="
    M 10,11
    Q 30,8  60,9
    Q 95,11 130,8
    Q 165,6 200,10
    Q 230,12 258,9
    Q 268,8 272,9
    L 272,12
    Q 268,14 258,12
    Q 230,15 200,13
    Q 165,11 130,13
    Q 95,16 60,13
    Q 30,12 10,14
    Z"/>
  <!-- painterly drip / splatter at the right tail -->
  <circle cx="266" cy="15" r="1.1" fill="currentColor" opacity="0.7"/>
  <circle cx="271" cy="17" r="0.6" fill="currentColor" opacity="0.45"/>
  <circle cx="275" cy="13" r="0.5" fill="currentColor" opacity="0.5"/>
</svg>

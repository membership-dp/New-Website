<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 420" fill="none">
  <g fill="#1B2F44">
    <!-- tapered stem rising to the bloom -->
    <path d="M120,416 C112,344 130,300 122,236 C116,196 126,176 120,150
             C124,176 132,196 130,236 C136,300 120,344 128,416 Z"/>
    <!-- two slim leaves on the stem -->
    <g transform="translate(122,300) rotate(140) scale(0.62)">
      <path fill-rule="evenodd" d="M0,0 C-9,-16 -8,-46 0,-72 C8,-46 9,-16 0,0 Z M0,-10 C-1.4,-28 -1.4,-50 0,-64 C1.4,-50 1.4,-28 0,-10 Z"/>
    </g>
    <g transform="translate(124,232) rotate(-40) scale(0.56)">
      <path fill-rule="evenodd" d="M0,0 C-9,-16 -8,-46 0,-72 C8,-46 9,-16 0,0 Z M0,-10 C-1.4,-28 -1.4,-50 0,-64 C1.4,-50 1.4,-28 0,-10 Z"/>
    </g>
    <!-- refined trumpet bloom: 5 slim tapered petals fanning from the throat -->
    <g transform="translate(120,150)">
      <path transform="rotate(-58)" d="M0,0 C-8,-18 -7,-58 0,-86 C7,-58 8,-18 0,0 Z"/>
      <path transform="rotate(-29)" d="M0,0 C-9,-20 -8,-66 0,-96 C8,-66 9,-20 0,0 Z"/>
      <path transform="rotate(0)"   d="M0,0 C-9,-22 -8,-70 0,-104 C8,-70 9,-22 0,0 Z"/>
      <path transform="rotate(29)"  d="M0,0 C-9,-20 -8,-66 0,-96 C8,-66 9,-20 0,0 Z"/>
      <path transform="rotate(58)"  d="M0,0 C-8,-18 -7,-58 0,-86 C7,-58 8,-18 0,0 Z"/>
    </g>
    <!-- slender funnel from bloom base to stem -->
    <path d="M111,150 C108,176 116,190 120,210 C124,190 132,176 129,150 C124,158 116,158 111,150 Z"/>
  </g>
</svg>

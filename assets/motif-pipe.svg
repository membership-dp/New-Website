<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none">
  <g fill="#1B2F44">
    <!-- 5 filled petals fanning across the top (thin bg gaps read as divisions) -->
    <g transform="translate(160,152)">
      <path transform="rotate(-52)" d="M0,0 C-19,-26 -17,-72 0,-98 C17,-72 19,-26 0,0 Z"/>
      <path transform="rotate(-26)" d="M0,0 C-20,-28 -18,-78 0,-106 C18,-78 20,-28 0,0 Z"/>
      <path transform="rotate(0)"   d="M0,0 C-21,-30 -19,-82 0,-112 C19,-82 21,-30 0,0 Z"/>
      <path transform="rotate(26)"  d="M0,0 C-20,-28 -18,-78 0,-106 C18,-78 20,-28 0,0 Z"/>
      <path transform="rotate(52)"  d="M0,0 C-19,-26 -17,-72 0,-98 C17,-72 19,-26 0,0 Z"/>
    </g>
    <!-- throat + funnel tube: filled, with a negative throat opening (evenodd) -->
    <path fill-rule="evenodd" d="M131,150
             C124,196 142,214 150,256 L170,256 C178,214 196,196 189,150
             C176,166 144,166 131,150 Z
             M141,158 C150,170 170,170 179,158 C170,150 150,150 141,158 Z"/>
    <!-- tapered stem ribbon curving to the pipe-bowl foot -->
    <path d="M160,256 C160,300 130,326 126,360 C123,386 134,396 122,410
             C132,398 121,388 124,360 C128,330 156,304 154,256 Z"/>
    <!-- leaf: filled lanceolate with negative midrib -->
    <g transform="translate(176,232) rotate(58) scale(0.7)">
      <path fill-rule="evenodd" d="M0,0 C-17,-20 -19,-58 0,-96 C19,-58 17,-20 0,0 Z
               M0,-12 C-2,-34 -2,-62 0,-84 C2,-62 2,-34 0,-12 Z"/>
    </g>
    <!-- pipe-bowl foot: filled cup with a negative opening -->
    <path fill-rule="evenodd" d="M100,398 C95,418 110,432 130,426 C141,422 144,410 137,402
             C131,412 113,412 108,398 C106,401 102,401 100,398 Z
             M110,400 C118,408 130,407 134,400 C129,395 117,395 110,400 Z"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" fill="none" role="img" aria-label="Dutchman's Pipe Club — vine and pipe-flower motif">
  <g stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- main vine -->
    <path d="M196,432 C168,372 150,338 176,292 C198,252 168,224 176,188 C182,160 168,140 178,118"/>

    <!-- lower-left heart leaf -->
    <g transform="translate(176,300) rotate(-42)">
      <path d="M0,0 C-7,-9 -34,-11 -49,-34 C-62,-55 -47,-86 0,-108 C47,-86 62,-55 49,-34 C34,-11 7,-9 0,0 Z"/>
      <path d="M0,-6 L0,-100" stroke-width="2"/>
      <path d="M0,-44 C-14,-52 -24,-58 -33,-70 M0,-44 C14,-52 24,-58 33,-70" stroke-width="1.6"/>
    </g>

    <!-- mid-right heart leaf -->
    <g transform="translate(176,212) rotate(34) scale(0.86)">
      <path d="M0,0 C-7,-9 -34,-11 -49,-34 C-62,-55 -47,-86 0,-108 C47,-86 62,-55 49,-34 C34,-11 7,-9 0,0 Z"/>
      <path d="M0,-6 L0,-100" stroke-width="2"/>
      <path d="M0,-44 C-14,-52 -24,-58 -33,-70 M0,-44 C14,-52 24,-58 33,-70" stroke-width="1.6"/>
    </g>

    <!-- the pipe-flower: inflated base + bent tube + flared bell mouth (Aristolochia) -->
    <g transform="translate(178,120)">
      <!-- inflated ovary/base bulb where it meets the stem -->
      <path d="M-14,0 C-24,-12 -22,-34 -6,-42 C12,-50 30,-40 30,-22 C30,-12 25,-4 18,0"/>
      <!-- back wall of the bent tube: up from bulb, arcing right -->
      <path d="M-6,-42 C0,-70 22,-90 54,-88 C82,-86 100,-70 100,-48"/>
      <!-- front wall of the bent tube, parallel inside the curve -->
      <path d="M28,-24 C34,-50 50,-66 74,-66 C90,-66 100,-58 100,-48"/>
      <!-- flared bell mouth opening downward (the 'pipe' opening) -->
      <path d="M100,-48 C114,-44 118,-26 104,-18 C92,-12 78,-18 76,-32"/>
      <path d="M76,-32 C84,-30 94,-28 104,-18" stroke-width="1.8"/>
    </g>
  </g>
</svg>

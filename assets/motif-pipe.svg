<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" fill="none" role="img" aria-label="Dutchman's Pipe Club — trumpet flower motif">
  <!-- Original DPC trumpet-flower motif (not a copy of any licensed artwork).
       Modeled on the reference's gesture: a flared trumpet bloom with a dark
       throat, a funnel body, a single leaf, a curving stem, and the signature
       flared "pipe bowl" foot. Line-art in brand navy via currentColor so it
       recolors cleanly as a CSS mask, matching the existing motif system. -->
  <g stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Trumpet mouth: 5 scalloped petal lobes across the top, rounded lower lip -->
    <path d="M66,112
             A 18 23 0 0 1 102,112
             A 18 23 0 0 1 138,112
             A 18 23 0 0 1 174,112
             A 18 23 0 0 1 210,112
             A 18 23 0 0 1 246,112
             C 250,140 212,156 160,156
             C 108,156 66,140 66,112 Z"/>
    <!-- Throat (the trumpet opening) -->
    <ellipse cx="160" cy="118" rx="44" ry="15"/>
    <!-- a couple of inner ribs for depth -->
    <path d="M134,124 C140,138 150,146 160,150 M186,124 C180,138 170,146 160,150" stroke-width="1.8"/>
    <!-- Funnel body narrowing from the mouth down to the tube -->
    <path d="M108,150 C103,192 140,212 149,252"/>
    <path d="M212,150 C217,192 180,212 171,252"/>
    <!-- Curving stem down to the pipe-bowl foot -->
    <path d="M160,252 C160,302 130,330 127,360 C124,386 132,398 123,410"/>
    <!-- Single leaf branching to the right off the funnel -->
    <path d="M198,214 C238,205 282,236 302,300 C262,300 214,272 198,230 Z"/>
    <path d="M206,226 C240,252 270,274 296,298" stroke-width="1.8"/>
    <!-- Pipe-bowl foot: a small flared cup at the base of the stem -->
    <path d="M101,400 C96,420 110,434 130,429 C142,426 145,413 139,405"/>
    <ellipse cx="112" cy="399" rx="13" ry="5" transform="rotate(-36 112 399)"/>
  </g>
</svg>

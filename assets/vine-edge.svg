<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" fill="none">
  <g fill="#1B2F44">
    <!-- calligraphic tapered stem: one gentle S, thick left -> hairline right -->
    <path d="M6,66 C150,40 250,52 360,64 C470,76 545,80 676,58
             C545,84 470,80 360,68 C250,56 150,46 6,72 Z"/>
    <!-- slim leaves w/ hairline midrib, asymmetric rhythm -->
    <g transform="translate(140,60) rotate(-26) scale(0.66)">
      <path fill-rule="evenodd" d="M0,0 C-9,-16 -8,-46 0,-72 C8,-46 9,-16 0,0 Z M0,-10 C-1.4,-28 -1.4,-50 0,-64 C1.4,-50 1.4,-28 0,-10 Z"/>
    </g>
    <g transform="translate(300,66) rotate(150) scale(0.5)">
      <path fill-rule="evenodd" d="M0,0 C-9,-16 -8,-46 0,-72 C8,-46 9,-16 0,0 Z M0,-10 C-1.4,-28 -1.4,-50 0,-64 C1.4,-50 1.4,-28 0,-10 Z"/>
    </g>
    <g transform="translate(430,64) rotate(20) scale(0.74)">
      <path fill-rule="evenodd" d="M0,0 C-9,-16 -8,-46 0,-72 C8,-46 9,-16 0,0 Z M0,-10 C-1.4,-28 -1.4,-50 0,-64 C1.4,-50 1.4,-28 0,-10 Z"/>
    </g>
    <!-- furled bud near the tapering tip -->
    <path d="M600,60 C612,51 627,57 626,70 C625,80 614,83 607,78 C601,74 599,66 600,60 Z"/>
  </g>
  <g stroke="#1B2F44" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M232,62 C234,46 222,42 217,52 C214,58 223,61 225,53"/>
    <path d="M520,62 C522,48 534,45 539,54"/>
  </g>
</svg>
